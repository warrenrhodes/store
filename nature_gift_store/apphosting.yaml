# Firebase App Hosting config. NEXT_PUBLIC_* values end up in the browser bundle anyway.
# Secrets live in Cloud Secret Manager (see scripts/apphosting-secrets.sh at repo root).
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: USE_SECURE_COOKIES
    value: "true"
  - variable: NEXT_PUBLIC_ADMIN_DASHBOARD_URL
    value: "https://nature-gift-admin--nature-s-gift.us-east4.hosted.app"
    availability: [BUILD, RUNTIME]
  # Marketplace contact form; a store's goes to the emails of its Settings.
  - variable: PLATFORM_CONTACT_EMAIL
    value: "webanalyse237@gmail.com"
  - variable: NEXT_PUBLIC_PLATFORM_URL
    value: "https://store--nature-s-gift.us-east4.hosted.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCohQ9FJ0q2VRCivBrBuRKjwBcw4K7Pv3o"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:540223944399:web:69c7f6a48e5143cd6729ba"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "nature-s-gift.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "540223944399"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "nature-s-gift"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "nature-s-gift.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  # GTM of the marketplace pages; a store's containers are in its Settings.
  - variable: PLATFORM_GTM_ID
    value: "GTM-PZPWRLKC"
  - variable: NOTIFICATIONAPI_CLIENT_ID
    value: "2ldisojs05o7o3av8e4rp2xsjv"
  - variable: NOTIFICATIONAPI_CLIENT_SECRET
    value: "hi40l6noacet9umzici8kr8wyeztvkqsyk1zpnkuymjykxgl5k29awjo1g"
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: AUTH_COOKIE_SIGNATURE_KEY_CURRENT
    secret: AUTH_COOKIE_SIGNATURE_KEY_CURRENT
  - variable: AUTH_COOKIE_SIGNATURE_KEY_PREVIOUS
    secret: AUTH_COOKIE_SIGNATURE_KEY_PREVIOUS
  # Platform alert when the storefront can't read Firestore; a store's order Flock is in its Settings.
  - variable: PLATFORM_FLOCK_WEBHOOK_URL
    secret: FLOCK_WEBHOOK_URL
  - variable: REVALIDATE_SECRET
    secret: REVALIDATE_SECRET
